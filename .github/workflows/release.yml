name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions: {}

# Serialize releases: concurrent runs computed the same next tag and published out of order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || steps.tag.outputs.new_tag }}
    permissions:
      contents: write
      id-token: write      # keyless identity used to sign the provenance attestation
      attestations: write  # store the attestation on the repo
    steps:
      # audit, not block: this job's egress (sigstore, syft, the krew-index
      # push) moves with every dependency, and a stale allowlist would fail
      # the release after the archives are already built.
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Needed by svu below, and by goreleaser further down.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release publishes artifacts; avoid cache-poisoning vector
      # svu derives the next version from the conventional commits since the
      # last tag, and prints the current one back when nothing warrants a
      # release -- which is the gate below. --v0 keeps a breaking change on a
      # 0.x project from jumping straight to v1.0.0.
      - name: Compute next version
        id: tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=caarlos0/svu
          SVU_VERSION: v3.4.1
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
          svu="${RUNNER_TEMP}/bin/svu"

          current=$("$svu" current)
          next=$("$svu" next --v0)
          if [ "$next" = "$current" ]; then
            echo "No releasable commit since ${current} - nothing to do."
            exit 0
          fi

          echo "Tagging ${next} (previous: ${current})"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${GITHUB_SHA}" --silent
          echo "new_tag=${next}" >> "$GITHUB_OUTPUT"
      # The tag was created through the API, so the local clone needs it before
      # goreleaser can read the version off it.
      - name: Fetch tags
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        run: git fetch --tags --force
      # goreleaser-action verifies the cosign signature of the goreleaser
      # binary it downloads; without cosign on PATH it silently skips that check.
      - name: Install cosign
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # goreleaser shells out to syft for the SBOMs and fails the whole release
      # if it is missing, after the archives are already built.
      - name: Install syft
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KREW_INDEX_TOKEN: ${{ secrets.KREW_INDEX_TOKEN }}

      # A signature says who published; provenance says how it was built (repo,
      # workflow, commit). Verified with `gh attestation verify <file> --repo`.
      - name: Attest build provenance
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz,dist/checksums.txt,dist/*.sbom.json'

  # Signing and provenance are only worth having if they verify. goreleaser's
  # own repository runs this after every release; without it a broken signing
  # config ships in silence and the first person to notice is a user.
  verify:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the published artifacts
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sigstore.json'

      # checksums.txt lists the SHA256 of every archive, so one check covers
      # them all. --ignore-missing tolerates archives we did not download.
      - name: Verify checksums
        run: shasum -a 256 --check --ignore-missing checksums.txt

      # Keyless: the identity is the workflow that signed, not a key. Pinning
      # the identity regexp is what makes the signature mean something. The
      # automated release signs from a push to main, so the SAN ends in
      # refs/heads/main; refs/tags/v only covers the manual tag escape hatch.
      # Do NOT relax this to a bare refs/ prefix - any branch could then sign.
      # The trailing $ is load-bearing: cosign does not anchor the end of the
      # regexp, so an unanchored heads/main also matches heads/main-evil.
      - name: Verify the cosign signature
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v[0-9]+\\.[0-9]+\\.[0-9]+)\$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      - name: Verify the build provenance
        run: |
          set -euo pipefail
          for f in *.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
